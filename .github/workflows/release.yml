name: Release (macOS app zip)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build (Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -project CarryOver.xcodeproj \
            -scheme CarryOver \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath spm \
            clean build

      - name: Locate .app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release -maxdepth 2 -name "CarryOver.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "CarryOver.app not found!"
            find build/Build/Products -maxdepth 4 -type d -name "*.app" -print
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Zip app
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" CarryOver.app.zip

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract the section for this tag: everything between ## [vX.Y.Z] and the next ## [ (or EOF)
          sed -n "/^## \\[${TAG}\\]/,/^## \\[/{/^## \\[${TAG}\\]/d;/^## \\[/d;p;}" CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "No changelog entry found for ${TAG}" > /tmp/release_notes.md
          fi

      - name: Update appcast.xml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Contents/Info.plist")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/CarryOver.app.zip"
          PUB_DATE=$(date -R)

          cat > appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>CarryOver Updates</title>
              <link>https://monil1301.github.io/CarryOver/appcast.xml</link>
              <description>Updates for CarryOver</description>
              <language>en</language>
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <enclosure
                  url="${DOWNLOAD_URL}"
                  type="application/octet-stream"
                />
              </item>
            </channel>
          </rss>
          EOF

          # Push gh-pages branch with appcast, landing page, and mockup
          cp appcast.xml /tmp/appcast.xml
          cp index.html /tmp/index.html
          cp mockup.png /tmp/mockup.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/appcast.xml appcast.xml
          cp /tmp/index.html index.html
          cp /tmp/mockup.png mockup.png
          git add appcast.xml index.html mockup.png
          git commit -m "Update appcast and landing page for ${TAG}"
          git push origin gh-pages-tmp:gh-pages --force

      - name: Create GitHub Release and upload assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CarryOver.app.zip
          body_path: /tmp/release_notes.md
